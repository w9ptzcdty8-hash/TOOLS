<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ向けViewport設定（自動ズーム・誤作動防止） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ向けカウンター</title>
    <style>
        /* --- 全体スタイル・ダークモード設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* タップ時のハイライトやテキスト選択を防止 */
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* テキスト入力欄はテキスト選択を許可 */
        input[type="text"] {
            -webkit-user-select: text;
            user-select: text;
        }

        /* --- ヘッダー・タブ切替 --- */
        header {
            background-color: #1E1E1E;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }

        /* --- メインコンテンツエリア --- */
        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- シングルカウンター --- */
        .single-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .count-display-section {
            background-color: #1A1A1A;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
            flex-shrink: 0;
        }

        .count-number {
            font-size: 64px;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 15px;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #FFF;
            transition: opacity 0.1s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-plus { background-color: #2E7D32; font-size: 24px; }
        .btn-minus { background-color: #C62828; font-size: 24px; }
        .btn-save { background-color: #1565C0; }
        .btn-reset { background-color: #424242; color: #AAA; }

        /* 履歴テーブルエリア */
        .history-section {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #121212;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #333;
        }

        .history-title {
            font-size: 14px;
            color: #888;
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: #E57373;
            font-size: 12px;
            cursor: pointer;
        }

        /* テーブル基本デザイン */
        .custom-table-wrapper {
            width: 100%;
            overflow-x: auto;
            background-color: #1A1A1A;
            border-radius: 8px;
            border: 1px solid #2A2A2A;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        .custom-table th, .custom-table td {
            padding: 10px 10px;
            border-bottom: 1px solid #2A2A2A;
            white-space: nowrap;
        }

        .custom-table th {
            background-color: #1E1E1E;
            color: #888;
            font-weight: normal;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .custom-table td.val-cell {
            font-weight: bold;
            color: #4CAF50;
            text-align: right;
        }

        .custom-table td.no-cell {
            color: #4CAF50;
            font-weight: bold;
            width: 45px;
        }

        .table-label-input {
            background: none;
            border: none;
            border-bottom: 1px dashed #555;
            color: #FFF;
            font-size: 13px;
            padding: 2px 4px;
            width: 110px;
        }

        .table-label-input:focus {
            outline: none;
            border-bottom-color: #4CAF50;
        }

        /* --- マルチカウンター --- */
        .multi-container {
            padding: 15px;
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .multi-controls {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .add-counter-btn {
            flex: 1;
            padding: 12px;
            background-color: #1E1E1E;
            border: 1px dashed #4CAF50;
            color: #4CAF50;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-score-btn {
            flex: 1;
            padding: 12px;
            background-color: #1565C0;
            border: none;
            color: #FFF;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .multi-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .multi-card {
            background-color: #1E1E1E;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .multi-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .multi-label-input {
            background: none;
            border: none;
            border-bottom: 1px solid #444;
            color: #FFF;
            font-size: 15px;
            padding: 2px 4px;
            width: 65%;
        }

        .multi-label-input:focus {
            outline: none;
            border-bottom-color: #4CAF50;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #E57373;
            font-size: 12px;
            cursor: pointer;
        }

        .multi-card-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .multi-val {
            font-size: 28px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .multi-btn-group {
            display: flex;
            gap: 8px;
        }

        .sm-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #FFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sm-btn:active {
            opacity: 0.7;
        }

        .sm-btn-plus { background-color: #2E7D32; }
        .sm-btn-minus { background-color: #C62828; }
        .sm-btn-reset { background-color: #424242; font-size: 11px; color: #AAA; }

        /* 保存履歴エリア */
        .history-board-section {
            margin-top: 10px;
            background-color: #1A1A1A;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #333;
        }

        .history-board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-board-title {
            font-size: 14px;
            font-weight: bold;
            color: #4CAF50;
        }

        .history-table {
            width: 100%;
        }

        .history-table th, .history-table td {
            text-align: center;
        }

        .history-table th.time-col, .history-table td.time-col {
            text-align: left;
        }

        .history-table tfoot td {
            background-color: #242424;
            font-weight: bold;
            color: #FFB74D;
            border-top: 2px solid #444;
        }

        .empty-msg {
            text-align: center;
            color: #666;
            padding: 20px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- ヘッダー：タブ選択 -->
    <header>
        <button class="tab-btn active" onclick="switchTab('single')">シングル</button>
        <button class="tab-btn" onclick="switchTab('multi')">マルチ</button>
    </header>

    <main>
        <!-- シングルカウンター タブ -->
        <div id="single-tab" class="tab-content active">
            <div class="single-container">
                <div class="count-display-section">
                    <div id="single-count" class="count-number">0</div>
                    <div class="btn-group" style="margin-bottom: 10px;">
                        <button class="btn btn-minus" onclick="changeSingleCount(-1)">ー</button>
                        <button class="btn btn-plus" onclick="changeSingleCount(1)">＋</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-reset" onclick="resetSingleCount()">リセット</button>
                        <button class="btn btn-save" onclick="saveSingleHistory()">保存</button>
                    </div>
                </div>

                <div class="history-section">
                    <div class="history-header">
                        <span class="history-title">保存履歴</span>
                        <button class="clear-history-btn" onclick="clearSingleHistory()">全削除</button>
                    </div>
                    <div class="custom-table-wrapper">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>No.</th>
                                    <th>日時</th>
                                    <th>ラベル</th>
                                    <th style="text-align: right;">カウント</th>
                                </tr>
                            </thead>
                            <tbody id="single-history-body">
                                <!-- JavaScriptで動的に追加されます -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- マルチカウンター タブ -->
        <div id="multi-tab" class="tab-content">
            <div class="multi-container">
                <div class="multi-controls">
                    <button class="add-counter-btn" onclick="addMultiCounter()">＋ カウンター追加</button>
                    <button class="save-score-btn" onclick="saveMultiHistory()">保存</button>
                </div>

                <div id="multi-list" class="multi-list">
                    <!-- カウンターカードがJavaScriptで挿入されます -->
                </div>

                <!-- 保存履歴一覧エリア -->
                <div class="history-board-section">
                    <div class="history-board-header">
                        <span class="history-board-title">保存履歴</span>
                        <button class="clear-history-btn" onclick="clearMultiHistory()">履歴クリア</button>
                    </div>
                    <div class="custom-table-wrapper">
                        <table class="custom-table history-table" id="history-table">
                            <thead id="history-table-head">
                                <!-- JavaScriptで動的に挿入されます -->
                            </thead>
                            <tbody id="history-table-body">
                                <!-- JavaScriptで動的に挿入されます -->
                            </tbody>
                            <tfoot id="history-table-foot">
                                <!-- 各項目ごとの合計が動的に挿入されます -->
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /* --- アプリの状態データ（LocalStorageと連動） --- */
        let state = {
            singleCount: 0,
            singleHistory: [], // { id, no, timestamp, label, value }
            multiCounters: [
                { id: 1, label: '項目 1', count: 0 },
                { id: 2, label: '項目 2', count: 0 }
            ],
            multiHistory: [] // [ { id, no, timestamp, scores: { [id]: count } } ]
        };

        // 初期化処理（ページ読み込み時）
        window.onload = function() {
            loadFromLocalStorage();
            renderSingle();
            renderMulti();
            renderMultiHistory();
        };

        /* --- ローカルストレージ処理 --- */
        function saveToLocalStorage() {
            localStorage.setItem('mobile_counter_v6_data', JSON.stringify(state));
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('mobile_counter_v6_data');
            if (data) {
                try {
                    state = JSON.parse(data);
                } catch(e) {
                    console.error('データの読み込みに失敗しました', e);
                }
            }
        }

        /* --- タブ切替処理 --- */
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'single') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('single-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('multi-tab').classList.add('active');
            }
        }

        /* --- シングルカウンター処理 --- */
        function renderSingle() {
            document.getElementById('single-count').textContent = state.singleCount;
            
            const tbody = document.getElementById('single-history-body');
            tbody.innerHTML = '';

            if (state.singleHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">履歴はありません</td></tr>';
                return;
            }

            // 昇順（古い順：#1が一番上で下に向かって追加）で表示
            state.singleHistory.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="no-cell">#${item.no}</td>
                    <td style="color:#AAA;">${item.timestamp}</td>
                    <td>
                        <input type="text" class="table-label-input" value="${escapeHtml(item.label || '')}" 
                            placeholder="メモ入力" onchange="updateSingleHistoryLabel(${item.id}, this.value)">
                    </td>
                    <td class="val-cell">${item.value}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeSingleCount(delta) {
            state.singleCount += delta;
            renderSingle();
            saveToLocalStorage();
        }

        function resetSingleCount() {
            state.singleCount = 0;
            renderSingle();
            saveToLocalStorage();
        }

        function saveSingleHistory() {
            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            const nextNo = state.singleHistory.length + 1;

            state.singleHistory.push({
                id: Date.now(),
                no: nextNo,
                timestamp: timeStr,
                label: '',
                value: state.singleCount
            });

            renderSingle();
            saveToLocalStorage();
        }

        function updateSingleHistoryLabel(id, newLabel) {
            const target = state.singleHistory.find(item => item.id === id);
            if (target) {
                target.label = newLabel;
                saveToLocalStorage();
            }
        }

        function clearSingleHistory() {
            if (state.singleHistory.length === 0) return;
            state.singleHistory = [];
            renderSingle();
            saveToLocalStorage();
        }

        /* --- マルチカウンター処理 --- */
        function renderMulti() {
            const container = document.getElementById('multi-list');
            container.innerHTML = '';

            if (state.multiCounters.length === 0) {
                container.innerHTML = '<div class="empty-msg">カウンターを追加してください</div>';
                return;
            }

            state.multiCounters.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'multi-card';
                card.innerHTML = `
                    <div class="multi-card-header">
                        <input type="text" class="multi-label-input" value="${escapeHtml(item.label)}" 
                            onchange="updateMultiLabel(${item.id}, this.value)" placeholder="項目名">
                        <button class="btn-delete" onclick="removeMultiCounter(${item.id})">削除</button>
                    </div>
                    <div class="multi-card-body">
                        <div class="multi-val">${item.count}</div>
                        <div class="multi-btn-group">
                            <button class="sm-btn sm-btn-minus" onclick="changeMultiCount(${item.id}, -1)">ー</button>
                            <button class="sm-btn sm-btn-plus" onclick="changeMultiCount(${item.id}, 1)">＋</button>
                            <button class="sm-btn sm-btn-reset" onclick="resetMultiCount(${item.id})">リセット</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addMultiCounter() {
            const newId = Date.now();
            state.multiCounters.push({
                id: newId,
                label: `項目 ${state.multiCounters.length + 1}`,
                count: 0
            });
            renderMulti();
            renderMultiHistory();
            saveToLocalStorage();
        }

        function removeMultiCounter(id) {
            state.multiCounters = state.multiCounters.filter(item => item.id !== id);
            renderMulti();
            renderMultiHistory();
            saveToLocalStorage();
        }

        function changeMultiCount(id, delta) {
            const target = state.multiCounters.find(item => item.id === id);
            if (target) {
                target.count += delta;
                renderMulti();
                saveToLocalStorage();
            }
        }

        function resetMultiCount(id) {
            const target = state.multiCounters.find(item => item.id === id);
            if (target) {
                target.count = 0;
                renderMulti();
                saveToLocalStorage();
            }
        }

        function updateMultiLabel(id, newLabel) {
            const target = state.multiCounters.find(item => item.id === id);
            if (target) {
                target.label = newLabel;
                renderMultiHistory();
                saveToLocalStorage();
            }
        }

        /* --- マルチ保存履歴テーブル（縦型構造） --- */
        function saveMultiHistory() {
            if (state.multiCounters.length === 0) return;

            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const scoresObj = {};

            // 現在のカウンター値を各IDごとにスナップショット保存
            state.multiCounters.forEach(c => {
                scoresObj[c.id] = c.count;
            });

            const nextNo = state.multiHistory.length + 1;

            state.multiHistory.push({
                id: Date.now(),
                no: nextNo,
                timestamp: timeStr,
                scores: scoresObj
            });

            renderMultiHistory();
            saveToLocalStorage();
        }

        function renderMultiHistory() {
            const thead = document.getElementById('history-table-head');
            const tbody = document.getElementById('history-table-body');
            const tfoot = document.getElementById('history-table-foot');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';
            tfoot.innerHTML = '';

            if (state.multiCounters.length === 0) {
                tbody.innerHTML = '<tr><td class="empty-msg">カウンター項目がありません</td></tr>';
                return;
            }

            if (state.multiHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + (state.multiCounters.length + 2) + '" class="empty-msg">保存された履歴はありません</td></tr>';
                return;
            }

            // 1. ヘッダーの生成 (No. / 日時 / [各項目名...])
            let trHead = document.createElement('tr');
            let headHTML = `
                <th style="width:45px;">No.</th>
                <th class="time-col">日時</th>
            `;
            state.multiCounters.forEach(c => {
                headHTML += `<th>${escapeHtml(c.label)}</th>`;
            });
            trHead.innerHTML = headHTML;
            thead.appendChild(trHead);

            // 各項目ごとの合計計算用のオブジェクト
            const columnTotals = {};
            state.multiCounters.forEach(c => {
                columnTotals[c.id] = 0;
            });

            // 2. 履歴データ行の生成（昇順：古い順に上から表示）
            state.multiHistory.forEach(h => {
                let tr = document.createElement('tr');
                let rowHTML = `
                    <td class="no-cell">#${h.no}</td>
                    <td class="time-col" style="color:#AAA;">${h.timestamp}</td>
                `;

                state.multiCounters.forEach(c => {
                    const val = (h.scores[c.id] !== undefined) ? h.scores[c.id] : '-';
                    if (typeof val === 'number') {
                        columnTotals[c.id] += val;
                    }
                    rowHTML += `<td>${val}</td>`;
                });

                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });

            // 3. フッター（一番下の各項目ごとの合計行）の生成
            let trFoot = document.createElement('tr');
            let footHTML = `
                <td colspan="2" style="text-align:right;">合計</td>
            `;
            state.multiCounters.forEach(c => {
                footHTML += `<td>${columnTotals[c.id]}</td>`;
            });
            trFoot.innerHTML = footHTML;
            tfoot.appendChild(trFoot);
        }

        function clearMultiHistory() {
            if (state.multiHistory.length === 0) return;
            state.multiHistory = [];
            renderMultiHistory();
            saveToLocalStorage();
        }

        // 入力時のHTML文字エスケープ用
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
